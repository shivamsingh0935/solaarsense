name: Run Automated Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Code ko checkout karo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js environment setup karo (agar aap Node.js use kar rahe hain)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Dependencies install karo
      - name: Install dependencies
        run: npm ci

      # 4. Tests run karo
      - name: Run test script
        run: npm test